:root{--bg:#f4f6f9;--fg:#14202e;--mut:#5b6b7c;--card:#fff;--line:#dde3ea;--acc:#1b6ef3;--warn:#b45309;--wbg:#fff4e0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e141b;--fg:#e8eef5;--mut:#93a3b5;--card:#17202a;--line:#2a3643;--acc:#5b9bff;--warn:#fbbf24;--wbg:#3a2d10}}
:root[data-theme="dark"]{--bg:#0e141b;--fg:#e8eef5;--mut:#93a3b5;--card:#17202a;--line:#2a3643;--acc:#5b9bff;--warn:#fbbf24;--wbg:#3a2d10}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:980px;margin:0 auto;padding:14px}
h1{font-size:22px;margin:0}h2{font-size:16px;margin:0 0 8px}h3{font-size:13px;margin:12px 0 4px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
small{color:var(--mut);display:block;font-size:12px}p{margin:6px 0}
.top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.btn{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:10px;padding:8px 12px;font:inherit;cursor:pointer}
.btn.on{background:var(--acc);color:#fff;border-color:var(--acc)}
#tabs{display:flex;gap:6px;overflow-x:auto;margin:12px 0}.tab{white-space:nowrap}
.demo{background:var(--wbg);color:var(--warn);border-radius:10px;padding:8px 12px;margin-bottom:10px}
#grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0}
.big{display:flex;gap:22px;margin:4px 0}.big span{font-size:30px;font-weight:700;display:block;line-height:1.1}
.row{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid var(--line)}.row:first-of-type{border:0}.v{text-align:right}
.b{display:inline-block;font-size:11px;border-radius:99px;padding:1px 8px;margin-left:6px;background:var(--line);color:var(--mut)}.b.w{background:var(--wbg);color:var(--warn)}
.lv{display:inline-block;color:#000;font-weight:700;border-radius:10px;padding:8px 14px;margin:2px 0 6px}
.warn{background:var(--wbg);color:var(--warn);border-radius:8px;padding:6px 10px;font-size:13px}.mut{color:var(--mut)}
ul.ls{list-style:none;margin:6px 0;padding:0}.ls li{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line)}
.ls li>span{flex:1;min-width:0}.ls em{font-style:normal;color:var(--mut);font-size:12px;text-align:right}
.d{width:10px;height:10px;border-radius:50%;background:#9aa7b4;flex:none}.d.open{background:#22a559}.d.closed{background:#d14343}.d.hold{background:#e0a100}
a{color:var(--acc)}.ft{font-size:12px;color:var(--mut);margin:16px 0}details summary{cursor:pointer;color:var(--acc);font-size:13px}
</style></head><body><main>
<div class="top"><div><h1>⛷️ Powderlog</h1><small id="meta"></small></div>
